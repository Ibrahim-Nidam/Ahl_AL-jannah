name: ahl_jannah
description: "Ahl Jannah — A comprehensive offline Islamic companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # State management & DI
  flutter_bloc: ^8.1.0
  get_it: ^7.6.0
  injectable: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Database
  drift: ^2.15.0
  sqlite3: ^2.0.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Storage
  shared_preferences: ^2.2.0

  # Prayer times & Qibla
  adhan: ^2.0.0+1
  geolocator: ^11.0.0
  hijri: ^3.0.0
  flutter_compass: ^0.8.1

  # Background & Notifications
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.1
  workmanager: ^0.9.0+3
  timezone: ^0.9.4
  android_intent_plus: ^5.0.0

  # Storage (Add Hive for Adhkar daily counters)
  hive_flutter: ^1.1.0

  # Haptic feedback
  vibration: ^3.1.3

  # UI
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  audioplayers: ^6.8.1
  share_plus: ^7.2.0

  # Quran reader: keep the screen awake while reading
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.15.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/quran.db
    - assets/quran_warsh.db
    - assets/adhan.mp3
    - assets/adhan_alfajr.mp3
    - assets/adhan_short.mp3
    - assets/adhkar.json
    - assets/adhkar_catalog.json
    - assets/adhkar_catalog.meta.json
    - assets/kaaba_icon.png
    - assets/app_icon.png
    - assets/hadith/bukhari/
    - assets/hadith/muslim/
    - assets/hadith/forty_nawawi/
    - assets/hadith/forty_qudsi/

  fonts:
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
        - asset: assets/fonts/Lateef-Bold.ttf
          weight: 700
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/uthmanic-hafs-v22.ttf
    - family: UthmanicWarsh
      fonts:
        - asset: assets/fonts/uthmanic-warsh-v21.ttf